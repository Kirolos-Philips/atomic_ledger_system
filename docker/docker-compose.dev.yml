services:

  # Web Application - Django + Gunicorn
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ledger_web
    command: /app/docker/entrypoint.sh python -m debugpy --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000
    volumes:
      - ..:/app
      - /app/.venv
    ports:
      - "8000:8000"
      - "5678:5678"
    env_file:
      - ../envs/dev/django.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Database - PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ledger_db
    env_file:
      - ../envs/dev/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ledger" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Broker - Redis
  redis:
    image: redis:7-alpine
    container_name: ledger_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Background Worker - Celery
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ledger_worker
    command: /app/docker/entrypoint.sh celery -A config worker --loglevel=info
    volumes:
      - ..:/app
      - /app/.venv
    env_file:
      - ../envs/dev/django.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Monitoring - Flower
  flower:
    image: mher/flower
    container_name: ledger_flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  # Email Testing - Mailpit
  mailpit:
    image: axllent/mailpit
    container_name: ledger_mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP server

volumes:
  postgres_data:
  redis_data:
