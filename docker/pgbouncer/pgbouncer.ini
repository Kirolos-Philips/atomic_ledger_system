[databases]
* = host=db port=5432 user=ledger password=ledger

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 2
ignore_startup_parameters = extra_float_digits
admin_users = ledger
stats_users = ledger
