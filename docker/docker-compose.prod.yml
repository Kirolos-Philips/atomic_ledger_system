services:

  # Web Application - Django + Gunicorn
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ledger_web_prod
    command: /app/docker/entrypoint.sh gunicorn --bind 0.0.0.0:8000 --workers 4 config.wsgi:application
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../envs/prod/django.env
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Database - PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ledger_db_prod
    restart: unless-stopped
    env_file:
      - ../envs/prod/postgres.env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ledger" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Connection Pooling Handler - PgBouncer
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ledger_pgbouncer_prod
    restart: unless-stopped
    env_file:
      - ../envs/prod/pgbouncer.env
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -p 6432 -U ledger" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Broker - Redis
  redis:
    image: redis:7-alpine
    container_name: ledger_redis_prod
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Background Worker - Celery
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ledger_worker_prod
    command: celery -A config worker --loglevel=info
    restart: unless-stopped
    env_file:
      - ../envs/prod/django.env
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data_prod:
  redis_data_prod:
